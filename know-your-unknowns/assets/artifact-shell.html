<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light; --ink: #171717; --muted: #666; --line: #d8d2c8; --paper: #f8f5ef; --panel: #fffdf8; --accent: #7a4b2a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
    main { max-width: 1120px; margin: 0 auto; padding: 40px 22px 64px; }
    h1 { margin: 0 0 10px; font-size: clamp(32px, 5vw, 58px); letter-spacing: 0; }
    h2 { margin: 30px 0 12px; font-size: 24px; }
    p { line-height: 1.55; }
    .lede { max-width: 760px; color: var(--muted); font-size: 18px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin: 18px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: #fff; }
    .label { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--accent); font-weight: 700; }
    textarea { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; }
    button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 9px 12px; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre { white-space: pre-wrap; background: #222; color: #f7f3ea; padding: 14px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <main>
    <div class="label">Know your unknowns / {{KIND}}</div>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{LEDE}}</p>

    <section class="panel">
      <div class="label">Original ask</div>
      <p>{{ASK}}</p>
    </section>

    <section>
      <h2>What we need to expose</h2>
      <div class="grid" id="unknowns"></div>
    </section>

    <section class="panel">
      <h2>Human loop</h2>
      <p>Choose, correct, confirm, or answer the items above. The artifact is not complete until the next prompt below reflects your decision.</p>
      <textarea id="nextPrompt">Replace this with the copy-back prompt or decision summary.</textarea>
      <p><button id="copy">Copy next prompt</button></p>
    </section>
  </main>
  <script>
    const unknowns = [
      ["Unknown", "Replace with evidence-backed assumption or decision."],
      ["Evidence", "Replace with files, docs, screenshots, diff hunks, or source references."],
      ["Stop condition", "Replace with what must be true before continuing."]
    ];
    document.getElementById("unknowns").innerHTML = unknowns.map(([title, body]) =>
      `<article class="card"><div class="label">${title}</div><p>${body}</p></article>`
    ).join("");
    document.getElementById("copy").addEventListener("click", async () => {
      const text = document.getElementById("nextPrompt").value;
      try { await navigator.clipboard.writeText(text); } catch (_) {}
    });
  </script>
</body>
</html>
